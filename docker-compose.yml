services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_SOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DB_SOURCE_PASSWORD}
      POSTGRES_DB: ${DB_SOURCE_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=local
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
volumes:
  postgres_data: